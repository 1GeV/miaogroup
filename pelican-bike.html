<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root{color-scheme:light;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#254e4c;background:#f5f3e9}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 20px}
    main{width:min(1080px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:20px}
    .eyebrow{font-size:11px;letter-spacing:3px;margin:0 0 12px;color:#698780}h1{font-weight:500;font-size:clamp(25px,4vw,40px);margin:0;letter-spacing:2px}
    .stamp{border:1px solid #bdc9bb;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.8;transform:rotate(9deg);flex-shrink:0}
    .scene{border-radius:22px;overflow:hidden;border:1px solid #d6dfcf;background:#dceee5;box-shadow:0 22px 60px #315c4510}svg{display:block;width:100%;height:auto}
    footer{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-top:24px;flex-wrap:wrap}.caption{font-size:13px;color:#698079;line-height:1.8;margin:0}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
    button{background:#285750;color:#fffdf1;border:0;border-radius:24px;padding:11px 22px;font:inherit;font-size:13px;cursor:pointer;min-width:100px}button:hover{background:#397168}button:focus-visible,input:focus-visible{outline:3px solid #d79546;outline-offset:5px}label{font-size:12px;display:flex;align-items:center;gap:10px}input{width:95px;accent-color:#397168}output{min-width:30px;font-variant-numeric:tabular-nums}
    @media(max-width:540px){body{padding:24px 14px}.stamp{width:54px;height:54px}header{margin-bottom:20px}.controls{gap:12px}footer{margin-top:18px}}
  </style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">A LITTLE COASTAL ADVENTURE</p><h1>鹈鹕的海岸骑行</h1></div><div class="stamp" aria-hidden="true">海风正好<br>LET’S RIDE</div></header>
  <div class="scene">
    <svg id="scene" viewBox="0 0 1000 620" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="scene-title">鹈鹕骑着绿色自行车沿海岸前行</title>
      <desc id="scene-desc">白色鹈鹕戴着绿色小帽和橙色围巾，双脚蹬踏自行车，车轮旋转，海边风景向后移动。可使用下方按钮暂停或调整速度。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d6ebe4"/><stop offset="1" stop-color="#eef1d7"/></linearGradient>
        <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#9bc9be"/><stop offset="1" stop-color="#bfdbbf"/></linearGradient>
        <pattern id="road" width="160" height="100" patternUnits="userSpaceOnUse"><path d="M20 48h65" stroke="#fffae8" stroke-width="5" stroke-linecap="round"/><path d="M112 79h10M38 13h5" stroke="#b8b5a0" stroke-width="2" stroke-linecap="round"/></pattern>
        <pattern id="waves" width="240" height="85" patternUnits="userSpaceOnUse"><path d="M20 22h60m50 35h70M5 72h25" stroke="#eff7de" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/></pattern>
        <g id="cloud" fill="#fffef0"><path d="M0 30C-5 15 12 8 25 15C27-8 63-8 68 14C83 6 104 16 99 30Z"/></g>
        <g id="wheel"><circle r="71" fill="#f4edd5" stroke="#314c49" stroke-width="9"/><circle r="61" fill="none" stroke="#a1afa1" stroke-width="2"/><g stroke="#91a399" stroke-width="1.5"><path d="M-60 0H60M0-60V60M-42-42L42 42M-42 42L42-42M-23-55L23 55M-55-23L55 23M-55 23L55-23M-23 55L23-55"/></g><circle r="8" fill="#e8dcb8" stroke="#345650" stroke-width="3"/></g>
        <g id="grass" fill="none" stroke="#789b79" stroke-width="3" stroke-linecap="round"><path d="M0 0q-4-19-14-24M0 0q0-24 9-32M0 0q8-16 19-18"/></g>
      </defs>
      <path fill="url(#sky)" d="M0 0h1000v620H0z"/>
      <circle cx="792" cy="124" r="49" fill="#f9d888"/><circle cx="792" cy="124" r="64" fill="none" stroke="#f4e2b0" stroke-width="1"/>
      <g id="clouds" opacity=".8"><use href="#cloud" x="100" y="98"/><use href="#cloud" x="449" y="61" transform="translate(110 0) scale(.8)"/><use href="#cloud" x="915" y="182"/><use href="#cloud" x="1100" y="98"/></g>
      <g fill="none" stroke="#79978b" stroke-width="2.5" stroke-linecap="round"><path d="M695 207q10-10 20 0q10-10 20 0M743 187q7-7 14 0q7-7 14 0"/></g>
      <path d="M0 315Q90 272 185 305T368 312Q433 274 510 309T750 308T1000 298V390H0Z" fill="#a7c4ad"/>
      <path fill="url(#sea)" d="M0 331h1000v119H0z"/><path fill="url(#waves)" id="water" d="M0 338h1000v105H0z"/>
      <path d="M0 430Q230 412 440 431T1000 420V479H0Z" fill="#dbd9ae"/>
      <path d="M0 458Q270 445 510 457T1000 448V620H0Z" fill="#c6c3ab"/>
      <path d="M0 463Q270 450 510 462T1000 453" fill="none" stroke="#f6ebcf" stroke-width="5"/>
      <path fill="url(#road)" d="M0 494h1000v126H0z"/>
      <g id="plants"><use href="#grass" x="110" y="451"/><use href="#grass" x="865" y="445"/><use href="#grass" x="1110" y="451"/></g>
      <ellipse cx="492" cy="524" rx="211" ry="15" fill="#5a7061" opacity=".14"/>
      <g id="rider">
        <g transform="translate(350 444)"><g id="rear-wheel"><use href="#wheel"/></g></g>
        <g transform="translate(640 444)"><g id="front-wheel"><use href="#wheel"/></g></g>
        <!-- The far leg sits behind the bicycle frame. -->
        <path id="far-leg" fill="none" stroke="#bb812f" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="far-foot" fill="none" stroke="#bb812f" stroke-width="10" stroke-linecap="round"/>
        <g fill="none" stroke-linejoin="round" stroke-linecap="round">
          <path d="M350 444L421 339L475 444H350L583 339L475 444M421 339H583M640 444L579 326L580 306" stroke="#2e766c" stroke-width="9"/>
          <path d="M350 444L421 339L475 444M421 339H583" stroke="#75a595" stroke-width="2.5"/>
          <path d="M421 339L413 317M580 308L575 289L608 282" stroke="#5a6f63" stroke-width="7"/>
          <path d="M603 282h19" stroke="#334f48" stroke-width="9"/>
          <path d="M599 291Q640 331 610 371" stroke="#6b8575" stroke-width="2"/>
          <path d="M386 316Q412 308 439 316" stroke="#754e3d" stroke-width="12"/>
        </g>
        <circle cx="475" cy="444" r="21" fill="#e0dfc4" stroke="#3f7365" stroke-width="4"/>
        <circle cx="475" cy="444" r="14" fill="none" stroke="#92a38a" stroke-width="2"/>
        <path d="M350 435L475 423A21 21 0 0 1 475 465L350 454A10 10 0 0 1 350 435Z" fill="none" stroke="#49685b" stroke-width="2"/>
        <g id="crank" stroke="#506d5c" stroke-width="6" stroke-linecap="round"><path d="M446 444H504"/></g>
        <!-- Rounded body, long curved neck and the pelican's distinctive throat pouch. -->
        <g id="bird">
          <path d="M376 281L331 253L344 287L326 279Q344 311 381 311" fill="#faf8e8" stroke="#4f6c60" stroke-width="3" stroke-linejoin="round"/>
          <path d="M375 245Q413 218 455 249Q486 267 505 242Q519 225 512 196Q498 162 521 139Q546 119 568 142Q590 168 563 197Q548 215 553 253Q553 298 513 320Q476 342 414 325Q368 315 365 285Q361 262 375 245Z" fill="#fffdf0" stroke="#4f6c60" stroke-width="3"/>
          <path d="M385 290Q427 329 491 305Q522 291 533 269Q516 322 469 326Q409 332 385 306Z" fill="#dce4cd"/>
          <path d="M557 167L682 182Q661 217 609 222Q574 220 557 185Z" fill="#eeb355" stroke="#846c3e" stroke-width="2.5"/>
          <path d="M556 165L695 181Q700 185 685 188L556 183" fill="#f7cf70" stroke="#846c3e" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M566 188Q586 218 615 215" fill="none" stroke="#d4933e" stroke-width="2"/>
          <circle cx="550" cy="156" r="5" fill="#294c46"/><circle cx="551.5" cy="154.5" r="1.5" fill="white"/>
          <path d="M535 142q8-5 14-2" stroke="#667a61" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M514 140Q513 111 542 110Q564 112 566 137" fill="#377a68" stroke="#345d50" stroke-width="2.5"/>
          <path d="M508 141Q544 131 583 140" fill="none" stroke="#2e6758" stroke-width="7" stroke-linecap="round"/>
          <path d="M525 118l2 12" stroke="#7ba18a" stroke-width="3" stroke-linecap="round"/>
          <path id="scarf-tail" d="M521 228Q488 218 460 229L469 241L454 251Q488 242 526 243Z" fill="#d77e50" stroke="#ab6846" stroke-width="2"/>
          <path d="M518 225Q534 236 552 227L552 240Q532 247 518 238Z" fill="#e5935e" stroke="#ab6846" stroke-width="2"/>
          <path d="M412 263Q443 252 476 276Q517 286 587 283Q600 285 590 294Q527 315 478 302Q436 306 412 279" fill="#f3f3de" stroke="#617966" stroke-width="3" stroke-linecap="round"/>
          <path d="M440 275Q466 292 486 288M435 284Q457 297 476 295" fill="none" stroke="#c3ceb3" stroke-width="2" stroke-linecap="round"/>
        </g>
        <path id="near-leg" fill="none" stroke="#dda143" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="near-foot" fill="none" stroke="#e9af4b" stroke-width="11" stroke-linecap="round"/>
        <g fill="#324e46"><rect id="near-pedal" width="30" height="7" rx="3"/><rect id="far-pedal" width="30" height="7" rx="3"/></g>
        <circle cx="475" cy="444" r="5" fill="#f4e5ba"/>
      </g>
      <g fill="#587365" font-family="system-ui,sans-serif" font-size="11" letter-spacing="3"><text x="40" y="576">THE COAST IS CALLING.</text><text x="930" y="576" text-anchor="end">01 / ∞</text></g>
    </svg>
  </div>
  <footer><p class="caption">不赶时间，跟着海风慢慢骑。<br>一只鹈鹕，一辆单车，一段好天气。</p><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停骑行</button><label for="speed">速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="speed-value" for="speed">1.0×</output></label></div></footer>
</main>
<script>
  const get = id => document.getElementById(id);
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = motionPreference.matches, speed = 1, time = 0, previous = null;
  function updateButton(){get('toggle').textContent = paused ? '继续骑行' : '暂停骑行';get('toggle').setAttribute('aria-pressed', String(paused));}
  get('toggle').addEventListener('click', () => {paused = !paused;updateButton();});
  get('speed').addEventListener('input', event => {speed = Number(event.target.value);get('speed-value').value = speed.toFixed(1) + '×';});
  motionPreference.addEventListener('change', event => {paused = event.matches;updateButton();});
  function draw(t){
    const angle = t * 3.6, degrees = angle * 180 / Math.PI;
    const bob = Math.sin(angle * 2) * 1.8;
    get('rear-wheel').setAttribute('transform', `rotate(${degrees})`);
    get('front-wheel').setAttribute('transform', `rotate(${degrees})`);
    get('crank').setAttribute('transform', `rotate(${degrees} 475 444)`);
    get('bird').setAttribute('transform', `translate(0 ${bob})`);
    get('scarf-tail').setAttribute('transform', `rotate(${Math.sin(angle * 2) * 5} 525 235)`);
    ['near', 'far'].forEach((side,index) => {
      const a = angle + index * Math.PI, x = 475 + 29 * Math.cos(a), y = 444 + 29 * Math.sin(a);
      // Solve a two-segment leg so its foot stays attached to the pedal.
      const hx = index ? 443 : 429, hy = 317 + bob, dx = x-hx, dy = y-hy;
      const length = Math.hypot(dx,dy), offset = Math.sqrt(Math.max(0, 84*84-length*length/4));
      const kx = (hx+x)/2 + dy/length*offset, ky = (hy+y)/2 - dx/length*offset;
      get(side+'-leg').setAttribute('d', `M${hx} ${hy}L${kx} ${ky}L${x} ${y-7}`);
      get(side+'-foot').setAttribute('d', `M${x-8} ${y-6}Q${x+6} ${y-10} ${x+14} ${y-4}`);
      get(side+'-pedal').setAttribute('x',x-15);get(side+'-pedal').setAttribute('y',y);
    });
    get('road').setAttribute('patternTransform', `translate(${-t*255.6%160} 0)`);
    get('waves').setAttribute('patternTransform', `translate(${-t*25%240} 0)`);
    get('clouds').setAttribute('transform', `translate(${-t*8%1000} 0)`);
    get('plants').setAttribute('transform', `translate(${-t*170%1000} 0)`);
  }
  function frame(now){if(previous!==null && !paused && !document.hidden)time+=Math.min((now-previous)/1000,.05)*speed;previous=now;draw(time);requestAnimationFrame(frame);}
  updateButton();draw(0);requestAnimationFrame(frame);
</script>
</body>
</html>
