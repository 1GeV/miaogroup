<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508" role="img" aria-labelledby="title description">
  <title id="title">Miao Group website poster</title>
  <desc id="description">Miao Group, School of Physics and Astronomy, Sun Yat-sen University. Four boundary-to-bulk curves and a homepage QR code.</desc>
  <rect width="2480" height="3508" fill="#ffffff"/>

  <!-- Editable typography; the source poster and seminar illustration are preserved separately. -->
  <g id="heading" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text id="group-name" x="1240" y="550" fill="#06265f" font-size="340">Miao Group</text>
    <g fill="#536d88" font-size="104">
      <text id="school" x="1240" y="790">School of Physics and Astronomy</text>
      <text id="university" x="1240" y="935">Sun Yat-sen University</text>
    </g>
    <text id="topics" x="1240" y="1130" fill="#124480" font-size="96">Holography · Strings · Quantum Gravity</text>
  </g>

  <!-- Uniformly scaled homepage geometry: four paths, each through one intermediate node. -->
  <g id="diagram" transform="translate(96 1310) scale(4.4)">
    <text x="42" y="25" fill="#536d88" font-family="Georgia, 'Times New Roman', serif" font-size="15">boundary</text>
    <g fill="none" stroke="#537faa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="42" y1="42" x2="478" y2="42"/>
      <path d="M90 42 C108 76 136 113 164 141 C192 169 226 209 260 245"/>
      <path d="M200 42 C216 79 231 116 241 150 C249 178 255 213 260 245"/>
      <path d="M320 42 C304 79 289 116 279 150 C271 178 265 213 260 245"/>
      <path d="M430 42 C412 76 384 113 356 141 C328 169 294 209 260 245"/>
    </g>
    <g fill="#ffffff" stroke="#124480" stroke-width="1.65">
      <circle cx="90" cy="42" r="6.7"/><circle cx="200" cy="42" r="6.7"/>
      <circle cx="320" cy="42" r="6.7"/><circle cx="430" cy="42" r="6.7"/>
      <circle cx="164" cy="141" r="6.7"/><circle cx="241" cy="150" r="6.7"/>
      <circle cx="279" cy="150" r="6.7"/><circle cx="356" cy="141" r="6.7"/>
    </g>
    <circle cx="260" cy="245" r="36" fill="#06265f"/>
    <text x="260" y="250.5" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="20" text-anchor="middle">bulk</text>
  </g>

  <g id="website-info" font-family="Georgia, 'Times New Roman', serif">
    <text id="website-heading" x="220" y="2825" fill="#124480" font-size="120" font-weight="700">Group website</text>
    <text id="website-summary" x="220" y="2978" fill="#607a94" font-size="76">Academic calendar · Seminar archive</text>
    <text id="website-url" x="220" y="3145" fill="#124480" font-size="80">1gev.github.io/miaogroup/</text>
  </g>

